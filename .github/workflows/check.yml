name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Check Go
        run: |
          go mod download
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Check Dart SDK
        working-directory: sdk/dart
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test

      - name: Check build tools
        working-directory: tools
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test
          dart run bin/verify_versions.dart
          dart run bin/verify_protocol.dart

      - name: Check Rust SDK
        run: |
          cargo fmt --manifest-path sdk/rust/Cargo.toml --check
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo clippy --manifest-path sdk/rust/Cargo.toml \
              --all-targets -- -D warnings
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo test --manifest-path sdk/rust/Cargo.toml

      - name: Check Dart CLI example
        working-directory: examples/dart-cli
        run: |
          dart pub get
          dart analyze
          dart run

      - name: Check Rust CLI example
        run: |
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo run --manifest-path examples/rust-cli/Cargo.toml

      - name: Check Flutter example tests
        working-directory: examples/flutter-app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  platform:
    name: Platform (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: android
            runner: ubuntu-latest
          - name: apple
            runner: macos-14
          - name: windows
            runner: windows-latest
          - name: web
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Set up MSVC environment
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Configure Rust MSVC linker
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\HostX64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libgtk-3-dev
          rustup target add aarch64-unknown-linux-gnu

      - name: Install Android build targets
        if: matrix.name == 'android'
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Install Apple build targets
        if: matrix.name == 'apple'
        run: |
          rustup target add \
            x86_64-apple-darwin aarch64-apple-darwin \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install Windows build target
        if: matrix.name == 'windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Compile Linux artifacts
        if: matrix.name == 'linux'
        working-directory: tools
        run: |
          dart pub get
          dart run bin/build_artifact.dart \
            --target linux-x86_64 --output ../build/artifacts
          CC=aarch64-linux-gnu-gcc \
            dart run bin/build_artifact.dart \
              --target linux-aarch64 --output ../build/artifacts

      - name: Compile Linux Rust consumers
        if: matrix.name == 'linux'
        run: |
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo build --manifest-path sdk/rust/Cargo.toml
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            CEL_BRIDGE_CROSS_CC=aarch64-linux-gnu-gcc \
            cargo check --manifest-path sdk/rust/Cargo.toml \
              --target aarch64-unknown-linux-gnu

      - name: Compile Linux examples
        if: matrix.name == 'linux'
        working-directory: examples/flutter-app
        run: |
          flutter pub get
          flutter build linux --debug

      - name: Run Linux tests last
        if: matrix.name == 'linux'
        run: |
          (cd examples/dart-cli && dart pub get && dart run)
          (cd examples/flutter-app && flutter test)
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo test --manifest-path sdk/rust/Cargo.toml
          cd tools
          dart run bin/build_manifest.dart --input ../build/artifacts
          dart run bin/verify_artifact.dart \
            --manifest ../build/artifacts/cel-bridge-manifest-v$(cat ../VERSION).json

      - name: Compile Android artifacts
        if: matrix.name == 'android'
        working-directory: tools
        run: |
          dart pub get
          for target in android-arm64-v8a android-armeabi-v7a android-x86_64; do
            case "$target" in
              android-arm64-v8a) compiler=aarch64-linux-android21-clang ;;
              android-armeabi-v7a) compiler=armv7a-linux-androideabi21-clang ;;
              android-x86_64) compiler=x86_64-linux-android21-clang ;;
            esac
            CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$compiler" \
              dart run bin/build_artifact.dart \
                --target "$target" --output ../build/artifacts
            CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$compiler" \
              dart run bin/build_artifact.dart \
                --target "rust-$target" --output ../build/artifacts
          done

      - name: Compile Android Rust consumers
        if: matrix.name == 'android'
        run: |
          for item in \
            'aarch64-linux-android:aarch64-linux-android21-clang' \
            'armv7-linux-androideabi:armv7a-linux-androideabi21-clang' \
            'x86_64-linux-android:x86_64-linux-android21-clang'; do
            target="${item%%:*}"
            compiler="${item##*:}"
            linker="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$compiler"
            linker_var="CARGO_TARGET_$(echo "$target" | tr '[:lower:]-' '[:upper:]_')_LINKER"
            compiler_var="CC_$(echo "$target" | tr '-' '_')"
            env "$linker_var=$linker" "$compiler_var=$linker" \
              CEL_BRIDGE_CROSS_CC="$linker" \
              CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
              cargo check --manifest-path sdk/rust/Cargo.toml --target "$target"
          done
          CEL_BRIDGE_CROSS_CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" \
            CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" \
            CC_x86_64_linux_android="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" \
            cargo build --manifest-path sdk/rust/tests-platform/android/Cargo.toml \
              --target x86_64-linux-android

      - name: Compile Android example
        if: matrix.name == 'android'
        working-directory: examples/flutter-app
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Run Android tests last
        if: matrix.name == 'android'
        run: |
          cd tools
          dart run bin/build_manifest.dart --input ../build/artifacts
          dart run bin/verify_artifact.dart \
            --manifest ../build/artifacts/cel-bridge-manifest-v$(cat ../VERSION).json
          cd ../examples/flutter-app
          flutter test

      - name: Run Android emulator tests
        if: matrix.name == 'android'
        id: android_emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 1200
          script: >-
            set -eu &&
            cd "$GITHUB_WORKSPACE/examples/flutter-app" &&
            flutter test --no-pub integration_test/runtime_test.dart -d emulator-5554 &&
            cd "$GITHUB_WORKSPACE" &&
            adb push sdk/rust/tests-platform/android/target/x86_64-linux-android/debug/cel-bridge-android-smoke /data/local/tmp/cel-bridge-android-smoke &&
            library="$(find sdk/rust/tests-platform/android/target -name libcel_bridge.so -type f | head -n 1)" &&
            test -n "$library" &&
            adb push "$library" /data/local/tmp/libcel_bridge.so &&
            adb shell chmod 755 /data/local/tmp/cel-bridge-android-smoke &&
            adb shell 'LD_LIBRARY_PATH=/data/local/tmp /data/local/tmp/cel-bridge-android-smoke'

      - name: Retry Android emulator tests
        if: matrix.name == 'android' && steps.android_emulator.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 1200
          script: >-
            set -eu &&
            cd "$GITHUB_WORKSPACE/examples/flutter-app" &&
            flutter test --no-pub integration_test/runtime_test.dart -d emulator-5554 &&
            cd "$GITHUB_WORKSPACE" &&
            adb push sdk/rust/tests-platform/android/target/x86_64-linux-android/debug/cel-bridge-android-smoke /data/local/tmp/cel-bridge-android-smoke &&
            library="$(find sdk/rust/tests-platform/android/target -name libcel_bridge.so -type f | head -n 1)" &&
            test -n "$library" &&
            adb push "$library" /data/local/tmp/libcel_bridge.so &&
            adb shell chmod 755 /data/local/tmp/cel-bridge-android-smoke &&
            adb shell 'LD_LIBRARY_PATH=/data/local/tmp /data/local/tmp/cel-bridge-android-smoke'

      - name: Compile Apple artifacts
        if: matrix.name == 'apple'
        working-directory: tools
        run: |
          dart pub get
          for target in macos-arm64 macos-x86_64 ios-arm64 ios-arm64-simulator ios-x86_64-simulator; do
            dart run bin/build_artifact.dart \
              --target "$target" --output ../build/artifacts
            dart run bin/build_artifact.dart \
              --target "rust-$target" --output ../build/artifacts
          done
          mkdir -p ../build/artifacts/ios-simulator
          lipo -create \
            ../build/artifacts/ios-arm64-simulator/libcel_bridge.a \
            ../build/artifacts/ios-x86_64-simulator/libcel_bridge.a \
            -output ../build/artifacts/ios-simulator/libcel_bridge.a
          xcodebuild -create-xcframework \
            -library ../build/artifacts/ios-arm64/libcel_bridge.a \
            -headers ../abi \
            -library ../build/artifacts/ios-simulator/libcel_bridge.a \
            -headers ../abi \
            -output ../build/artifacts/libcel_bridge.xcframework
          ditto -c -k --sequesterRsrc --keepParent \
            ../build/artifacts/libcel_bridge.xcframework \
            ../build/artifacts/cel-bridge-ios-xcframework-v$(cat ../VERSION).zip

      - name: Compile Apple Rust consumers
        if: matrix.name == 'apple'
        run: |
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo build --manifest-path sdk/rust/Cargo.toml \
              --target aarch64-apple-darwin
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo build --manifest-path sdk/rust/Cargo.toml \
              --target x86_64-apple-darwin
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
              cargo build --manifest-path sdk/rust/tests-platform/ios/Cargo.toml \
                --target "$target"
          done

      - name: Compile Apple examples
        if: matrix.name == 'apple'
        working-directory: examples/flutter-app
        env:
          CEL_BRIDGE_IOS_XCFRAMEWORK_PATH: ${{ github.workspace }}/build/artifacts/libcel_bridge.xcframework
        run: |
          flutter pub get
          flutter build macos --debug
          flutter build ios --simulator --no-codesign

      - name: Run Apple tests last
        if: matrix.name == 'apple'
        env:
          CEL_BRIDGE_IOS_XCFRAMEWORK_PATH: ${{ github.workspace }}/build/artifacts/libcel_bridge.xcframework
        run: |
          cd tools
          dart run bin/build_manifest.dart --input ../build/artifacts
          dart run bin/verify_artifact.dart \
            --manifest ../build/artifacts/cel-bridge-manifest-v$(cat ../VERSION).json
          cd ../examples/flutter-app
          flutter test

      - name: Run iOS simulator tests
        if: matrix.name == 'apple'
        env:
          CEL_BRIDGE_IOS_XCFRAMEWORK_PATH: ${{ github.workspace }}/build/artifacts/libcel_bridge.xcframework
        run: |
          cd examples/flutter-app
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /(Shutdown|Booted)/ {print $2; exit}')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          flutter test --no-pub integration_test/runtime_test.dart -d "$device_id"

      - name: Compile Windows artifacts
        if: matrix.name == 'windows'
        working-directory: tools
        run: |
          dart pub get
          dart run bin/build_artifact.dart \
            --target windows-x86_64 --output ../build/artifacts
          dart run bin/build_artifact.dart \
            --target rust-windows-x86_64 --output ../build/artifacts

      - name: Compile Windows consumers
        if: matrix.name == 'windows'
        run: |
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo build --release --manifest-path sdk/rust/Cargo.toml \
              --target x86_64-pc-windows-msvc
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            cargo build --release --manifest-path examples/rust-cli/Cargo.toml \
              --target x86_64-pc-windows-msvc
          (cd examples/flutter-app && flutter pub get && flutter build windows --debug)

      - name: Run Windows tests last
        if: matrix.name == 'windows'
        run: |
          cd tools
          dart run bin/build_manifest.dart --input ../build/artifacts
          dart run bin/verify_artifact.dart \
            --manifest ../build/artifacts/cel-bridge-manifest-v$(cat ../VERSION).json
          cd ../examples/dart-cli
          dart pub get
          dart run
          cd ../flutter-app/build/windows/x64/runner/Debug
          test -f cel_bridge.dll

      - name: Compile Web artifacts
        if: matrix.name == 'web'
        working-directory: tools
        run: |
          dart pub get
          dart run bin/build_artifact.dart --target wasm --output ../build/artifacts
          dart run bin/verify_web_integrity.dart \
            --wasm ../build/artifacts/wasm/cel_bridge.wasm \
            --wasm-exec ../build/artifacts/wasm/wasm_exec.js

      - name: Compile Web example
        if: matrix.name == 'web'
        run: |
          mkdir -p examples/flutter-app/web
          cp build/artifacts/wasm/cel_bridge.wasm examples/flutter-app/web/
          cp build/artifacts/wasm/wasm_exec.js examples/flutter-app/web/
          cd examples/flutter-app
          flutter pub get
          flutter build web --debug \
            --dart-define=CEL_BRIDGE_WASM_URL=/cel_bridge.wasm \
            --dart-define=CEL_BRIDGE_WASM_EXEC_URL=/wasm_exec.js

      - name: Run Web tests last
        if: matrix.name == 'web'
        run: |
          mkdir -p build/web-smoke
          cd tools
          dart run bin/build_manifest.dart --input ../build/artifacts
          dart run bin/verify_artifact.dart \
            --manifest ../build/artifacts/cel-bridge-manifest-v$(cat ../VERSION).json
          dart compile js bin/web_smoke.dart -o ../build/web-smoke/main.dart.js
          cp bin/web_smoke.html ../build/web-smoke/index.html
          cp ../build/artifacts/wasm/cel_bridge.wasm ../build/web-smoke/
          cp ../build/artifacts/wasm/wasm_exec.js ../build/web-smoke/
          cd ..
          python3 -m http.server 8124 --directory build/web-smoke >build/web-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8124/ >/dev/null; then break; fi
            sleep 1
          done
          cd tools
          dart run bin/web_smoke_runner.dart \
            http://127.0.0.1:8124/ | tee ../build/web-smoke/result.txt
          grep -Fq '0.2.0|true|true' ../build/web-smoke/result.txt
