name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Verify tag and versions
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -z "$(git status --short)"
          release_commit="$(git rev-parse HEAD)"
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$tag_commit" = "$release_commit"
          cd tools
          dart pub get
          dart run bin/verify_versions.dart --tag "$RELEASE_TAG"
          echo "version=$(cat ../VERSION)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful Check workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          successful_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow check.yml \
            --commit "$RELEASE_COMMIT" \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$successful_runs" -ge 1
          comparison="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...main" \
            --jq .status)"
          [[ "$comparison" == "ahead" || "$comparison" == "identical" ]]

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            kind: linux
          - name: android
            runner: ubuntu-latest
            kind: android
          - name: apple
            runner: macos-14
            kind: apple
          - name: windows
            runner: windows-latest
            kind: windows
          - name: web
            runner: ubuntu-latest
            kind: web
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Set up MSVC environment
        if: matrix.kind == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Prepare Linux compilers
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Prepare Android compilers
        if: matrix.kind == 'android'
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Build Linux Dart and Rust artifacts
        if: matrix.kind == 'linux'
        working-directory: tools
        run: |
          dart pub get
          dart run bin/build_artifact.dart \
            --target linux-x86_64 --output ../build/artifacts
          CC=aarch64-linux-gnu-gcc \
            dart run bin/build_artifact.dart \
              --target linux-aarch64 --output ../build/artifacts
          dart run bin/build_artifact.dart \
            --target rust-linux-x86_64 --output ../build/artifacts
          CC=aarch64-linux-gnu-gcc \
            dart run bin/build_artifact.dart \
              --target rust-linux-aarch64 --output ../build/artifacts

      - name: Build Android Dart and Rust artifacts
        if: matrix.kind == 'android'
        working-directory: tools
        run: |
          dart pub get
          for target in android-arm64-v8a android-armeabi-v7a android-x86_64; do
            case "$target" in
              android-arm64-v8a) compiler=aarch64-linux-android21-clang ;;
              android-armeabi-v7a) compiler=armv7a-linux-androideabi21-clang ;;
              android-x86_64) compiler=x86_64-linux-android21-clang ;;
            esac
            cc="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$compiler"
            CC="$cc" dart run bin/build_artifact.dart \
              --target "$target" --output ../build/artifacts
            CC="$cc" dart run bin/build_artifact.dart \
              --target "rust-$target" --output ../build/artifacts
          done

      - name: Build Apple Dart and Rust artifacts
        if: matrix.kind == 'apple'
        working-directory: tools
        run: |
          dart pub get
          for target in macos-arm64 macos-x86_64 ios-arm64 ios-arm64-simulator ios-x86_64-simulator; do
            dart run bin/build_artifact.dart \
              --target "$target" --output ../build/artifacts
            dart run bin/build_artifact.dart \
              --target "rust-$target" --output ../build/artifacts
          done
          mkdir -p ../build/artifacts/ios-simulator
          lipo -create \
            ../build/artifacts/ios-arm64-simulator/libcel_bridge.a \
            ../build/artifacts/ios-x86_64-simulator/libcel_bridge.a \
            -output ../build/artifacts/ios-simulator/libcel_bridge.a
          xcodebuild -create-xcframework \
            -library ../build/artifacts/ios-arm64/libcel_bridge.a \
            -headers ../abi \
            -library ../build/artifacts/ios-simulator/libcel_bridge.a \
            -headers ../abi \
            -output ../build/artifacts/libcel_bridge.xcframework
          ditto -c -k --sequesterRsrc --keepParent \
            ../build/artifacts/libcel_bridge.xcframework \
            ../build/artifacts/cel-bridge-ios-xcframework-v$(cat ../VERSION).zip
          ditto -c -k --sequesterRsrc --keepParent \
            ../build/artifacts/libcel_bridge.xcframework \
            ../build/artifacts/cel-bridge-rust-ios-xcframework-v$(cat ../VERSION).zip
          mkdir -p ../build/artifacts/macos-universal
          lipo -create \
            ../build/artifacts/macos-arm64/libcel_bridge.dylib \
            ../build/artifacts/macos-x86_64/libcel_bridge.dylib \
            -output ../build/artifacts/macos-universal/libcel_bridge.dylib
          tar -czf \
            ../build/artifacts/cel-bridge-macos-universal-v$(cat ../VERSION).tar.gz \
            -C ../build/artifacts/macos-universal libcel_bridge.dylib

      - name: Build Windows Dart and Rust artifacts
        if: matrix.kind == 'windows'
        working-directory: tools
        run: |
          dart pub get
          dart run bin/build_artifact.dart \
            --target windows-x86_64 --output ../build/artifacts
          dart run bin/build_artifact.dart \
            --target rust-windows-x86_64 --output ../build/artifacts

      - name: Build Web Dart artifacts
        if: matrix.kind == 'web'
        working-directory: tools
        run: |
          dart pub get
          dart run bin/build_artifact.dart --target wasm --output ../build/artifacts
          cp ../build/artifacts/wasm/cel_bridge.wasm ../build/artifacts/
          cp ../build/artifacts/wasm/wasm_exec.js ../build/artifacts/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.name }}
          path: build/artifacts/*
          if-no-files-found: error

  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: build/artifacts
          merge-multiple: true

      - name: Prepare and verify release files
        working-directory: tools
        run: |
          dart pub get
          dart run bin/verify_web_integrity.dart \
            --wasm ../build/artifacts/cel_bridge.wasm \
            --wasm-exec ../build/artifacts/wasm_exec.js
          mkdir -p ../build/release
          manifest="../build/release/cel-bridge-manifest-v$(cat ../VERSION).json"
          dart run bin/build_manifest.dart \
            --input ../build/artifacts --output "$manifest"
          dart run bin/verify_artifact.dart \
            --manifest "$manifest" --input ../build/artifacts
          find ../build/artifacts -maxdepth 1 -type f -exec cp {} ../build/release/ \;
          version="$(cat ../VERSION)"
          git archive --format=tar.gz \
            --prefix="cel-bridge-runtime-source-$version/" \
            -o "../build/release/cel-bridge-runtime-source-v$version.tar.gz" \
            "${{ needs.version.outputs.commit }}" \
            go.mod go.sum VERSION LICENSE abi runtime
          : > ../build/release/checksums.txt
          find ../build/release -maxdepth 1 -type f \
            ! -name checksums.txt \
            ! -name 'cel-bridge-manifest-*.json' \
            -printf '%f\n' | sort | while read -r file; do
              (cd ../build/release && sha256sum "$file") \
                >> ../build/release/checksums.txt
            done

      - name: Validate release target before mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          set +e
          release_lookup="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            test "$release_lookup" = true
          elif [[ "$release_status" -eq 1 && "$release_lookup" == "release not found" ]]; then
            :
          else
            printf '%s\n' "$release_lookup" >&2
            exit "$release_status"
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: cel-bridge ${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: build/release/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-consumption:
    needs: [version, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Download Draft Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release-download
          gh release download "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --dir build/release-download

      - name: Verify downloaded assets
        working-directory: tools
        run: |
          dart pub get
          dart run bin/verify_artifact.dart \
            --manifest ../build/release-download/cel-bridge-manifest-v$(cat ../VERSION).json \
            --input ../build/release-download
          (cd ../build/release-download && sha256sum -c checksums.txt)
          test -f ../build/release-download/cel_bridge.wasm
          test -f ../build/release-download/wasm_exec.js
          tar -tzf ../build/release-download/cel-bridge-runtime-source-v$(cat ../VERSION).tar.gz \
            | grep -Eq '(^|/)go\.mod$'

      - name: Run downloaded Web smoke
        working-directory: tools
        run: |
          mkdir -p ../build/release-web
          dart compile js bin/web_smoke.dart -o ../build/release-web/main.dart.js
          cp bin/web_smoke.html ../build/release-web/index.html
          cp ../build/release-download/cel_bridge.wasm ../build/release-web/
          cp ../build/release-download/wasm_exec.js ../build/release-web/
          cd ..
          python3 -m http.server 8127 --directory build/release-web >build/release-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8127/ >/dev/null; then break; fi
            sleep 1
          done
          cd tools
          dart run bin/web_smoke_runner.dart \
            http://127.0.0.1:8127/ | tee ../build/release-web/result.txt
          grep -Fq "${{ needs.version.outputs.version }}|true|true" \
            ../build/release-web/result.txt

      - name: Run downloaded Dart consumer
        run: |
          python3 -m http.server 8125 --directory build/release-download >build/release-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8125/ >/dev/null; then break; fi
            sleep 1
          done
          cd tools/fixtures/release_http_consumer
          dart pub get
          dart run bin/main.dart

      - name: Run downloaded Rust consumer
        run: |
          version="$(cat VERSION)"
          mkdir -p "build/release-download/v$version"
          find build/release-download -maxdepth 1 -type f \
            -exec cp {} "build/release-download/v$version/" \;
          python3 -m http.server 8126 --directory build/release-download >build/release-rust-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:8126/v$version/cel-bridge-manifest-v$version.json" >/dev/null; then break; fi
            sleep 1
          done
          CEL_BRIDGE_RELEASE_BASE_URL=http://127.0.0.1:8126 \
            CEL_BRIDGE_ALLOW_INSECURE_RELEASE_BASE=1 \
            cargo run --manifest-path tools/fixtures/rust-release-consumer/Cargo.toml --quiet

  release-platform-consumption:
    needs: [version, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            kind: linux
          - name: macos
            runner: macos-14
            kind: macos
          - name: windows
            runner: windows-latest
            kind: windows
          - name: android
            runner: ubuntu-latest
            kind: android
          - name: ios
            runner: macos-14
            kind: ios
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Set up Rust for release consumer
        if: matrix.kind == 'windows' || matrix.kind == 'macos' || matrix.kind == 'android' || matrix.kind == 'ios'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Set up MSVC for Windows consumer
        if: matrix.kind == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Configure Rust MSVC linker
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\HostX64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Android Rust target
        if: matrix.kind == 'android'
        run: |
          rustup target add x86_64-linux-android
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Install iOS Rust targets
        if: matrix.kind == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Download Draft Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release-download
          gh release download "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --dir build/release-download

      - name: Run downloaded desktop Dart consumer
        if: matrix.kind == 'linux' || matrix.kind == 'macos' || matrix.kind == 'windows'
        run: |
          python3 -m http.server 8125 --directory build/release-download >build/release-desktop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8125/ >/dev/null; then break; fi
            sleep 1
          done
          cd tools/fixtures/release_http_consumer
          dart pub get
          dart run bin/main.dart

      - name: Run downloaded macOS Rust consumer
        if: matrix.kind == 'macos'
        run: |
          version="$(cat VERSION)"
          mkdir -p "build/release-download/v$version"
          find build/release-download -maxdepth 1 -type f \
            -exec cp {} "build/release-download/v$version/" \;
          python3 -m http.server 8126 --directory build/release-download >build/release-macos-rust-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:8126/v$version/cel-bridge-manifest-v$version.json" >/dev/null; then break; fi
            sleep 1
          done
          CEL_BRIDGE_RELEASE_BASE_URL=http://127.0.0.1:8126 \
            CEL_BRIDGE_ALLOW_INSECURE_RELEASE_BASE=1 \
            cargo run --manifest-path tools/fixtures/rust-release-consumer/Cargo.toml --quiet

      - name: Run downloaded Windows Rust consumer
        if: matrix.kind == 'windows'
        run: |
          version="$(cat VERSION)"
          mkdir -p "build/release-download/v$version"
          find build/release-download -maxdepth 1 -type f \
            -exec cp {} "build/release-download/v$version/" \;
          python -m http.server 8126 --directory build/release-download >build/release-rust-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:8126/v$version/cel-bridge-manifest-v$version.json" >/dev/null; then break; fi
            sleep 1
          done
          CEL_BRIDGE_RELEASE_BASE_URL=http://127.0.0.1:8126 \
            CEL_BRIDGE_ALLOW_INSECURE_RELEASE_BASE=1 \
            cargo build --manifest-path tools/fixtures/rust-release-consumer/Cargo.toml --quiet
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          version = Path('VERSION').read_text().strip()
          archive = Path('build/release-download') / f'cel-bridge-rust-windows-x86_64-v{version}.zip'
          binary = Path('tools/fixtures/rust-release-consumer/target/debug/cel-bridge-rust-release-consumer.exe')
          with ZipFile(archive) as package:
              name = next(name for name in package.namelist() if Path(name).name == 'cel_bridge.dll')
              (binary.parent / 'cel_bridge.dll').write_bytes(package.read(name))
          PY
          tools/fixtures/rust-release-consumer/target/debug/cel-bridge-rust-release-consumer.exe

      - name: Prepare downloaded Android Rust consumer
        if: matrix.kind == 'android'
        run: |
          version="$(cat VERSION)"
          mkdir -p "build/release-rust-download/v$version"
          find build/release-download -maxdepth 1 -type f \
            -exec cp {} "build/release-rust-download/v$version/" \;
          python3 -m http.server 8126 --directory build/release-rust-download >build/release-android-rust-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:8126/v$version/cel-bridge-manifest-v$version.json" >/dev/null; then break; fi
            sleep 1
          done
          linker="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          CEL_BRIDGE_RELEASE_BASE_URL=http://127.0.0.1:8126 \
            CEL_BRIDGE_ALLOW_INSECURE_RELEASE_BASE=1 \
            CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$linker" \
            CC_x86_64_linux_android="$linker" \
            cargo build --manifest-path sdk/rust/tests-platform/android/Cargo.toml \
              --target x86_64-linux-android

      - name: Prepare downloaded Android example
        if: matrix.kind == 'android'
        run: |
          cp -R examples/flutter-app build/release-android-example
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/release-android-example/pubspec.yaml')
          text = path.read_text()
          old = '      build_from_source: true'
          new = '      build_from_source: false\n      release_base_url: http://127.0.0.1:8125/\n      allow_insecure_release_base: true'
          if old not in text:
              raise SystemExit('example hook configuration changed')
          path.write_text(text.replace(old, new))
          PY
          python3 -m http.server 8125 --directory build/release-download >build/release-android-http.log 2>&1 &
          server_pid=$!
          echo "RELEASE_HTTP_PID=$server_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8125/ >/dev/null; then break; fi
            sleep 1
          done
          cd build/release-android-example
          flutter pub get
          flutter build apk --debug --no-pub

      - name: Run downloaded Android example
        if: matrix.kind == 'android'
        id: android_emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: >-
            set -eu &&
            cd "$GITHUB_WORKSPACE/build/release-android-example" &&
            flutter test --no-pub integration_test/runtime_test.dart -d emulator-5554 &&
            cd "$GITHUB_WORKSPACE" &&
            binary="sdk/rust/tests-platform/android/target/x86_64-linux-android/debug/cel-bridge-android-smoke" &&
            library="$(find sdk/rust/tests-platform/android/target -type f -name libcel_bridge.so | head -n 1)" &&
            test -f "$binary" &&
            test -n "$library" &&
            adb push "$binary" /data/local/tmp/cel-bridge-android-smoke &&
            adb push "$library" /data/local/tmp/libcel_bridge.so &&
            adb shell chmod 755 /data/local/tmp/cel-bridge-android-smoke &&
            adb shell 'LD_LIBRARY_PATH=/data/local/tmp /data/local/tmp/cel-bridge-android-smoke'

      - name: Retry downloaded Android example
        if: matrix.kind == 'android' && steps.android_emulator.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: >-
            set -eu &&
            cd "$GITHUB_WORKSPACE/build/release-android-example" &&
            flutter test --no-pub integration_test/runtime_test.dart -d emulator-5554 &&
            cd "$GITHUB_WORKSPACE" &&
            binary="sdk/rust/tests-platform/android/target/x86_64-linux-android/debug/cel-bridge-android-smoke" &&
            library="$(find sdk/rust/tests-platform/android/target -type f -name libcel_bridge.so | head -n 1)" &&
            test -f "$binary" &&
            test -n "$library" &&
            adb push "$binary" /data/local/tmp/cel-bridge-android-smoke &&
            adb push "$library" /data/local/tmp/libcel_bridge.so &&
            adb shell chmod 755 /data/local/tmp/cel-bridge-android-smoke &&
            adb shell 'LD_LIBRARY_PATH=/data/local/tmp /data/local/tmp/cel-bridge-android-smoke'

      - name: Prepare downloaded iOS Rust consumer
        if: matrix.kind == 'ios'
        run: |
          version="$(cat VERSION)"
          mkdir -p "build/release-rust-download/v$version"
          find build/release-download -maxdepth 1 -type f \
            -exec cp {} "build/release-rust-download/v$version/" \;
          python3 -m http.server 8126 --directory build/release-rust-download >build/release-ios-rust-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:8126/v$version/cel-bridge-manifest-v$version.json" >/dev/null; then break; fi
            sleep 1
          done
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            CEL_BRIDGE_RELEASE_BASE_URL=http://127.0.0.1:8126 \
              CEL_BRIDGE_ALLOW_INSECURE_RELEASE_BASE=1 \
              cargo build --manifest-path sdk/rust/tests-platform/ios/Cargo.toml \
                --target "$target" --release
          done
          rust_library="$(find sdk/rust/tests-platform/ios/target/aarch64-apple-ios-sim/release \
            -maxdepth 1 -name libcel_bridge_ios_smoke.a -print -quit)"
          go_library="$(find sdk/rust/tests-platform/ios/target/aarch64-apple-ios-sim/release/build \
            -path '*/out/libcel_bridge.a' -print -quit)"
          test -n "$rust_library"
          test -n "$go_library"
          mkdir -p build/cel-bridge-rust-release-smoke.app
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          root = Path('build/cel-bridge-rust-release-smoke.app')
          (root / 'main.c').write_text(
              '#include <stdio.h>\n'
              'extern int cel_bridge_rust_smoke(void);\n'
              'int main(void) {\n'
              '  int result = cel_bridge_rust_smoke();\n'
              '  printf("cel-bridge rust iOS release smoke: %d\\n", result);\n'
              '  return result;\n'
              '}\n'
          )
          with (root / 'Info.plist').open('wb') as output:
              plistlib.dump(
                  {
                      'CFBundleDevelopmentRegion': 'en',
                      'CFBundleExecutable': 'CelBridgeRustSmoke',
                      'CFBundleIdentifier': 'com.celbridge.rust-release-smoke',
                      'CFBundleInfoDictionaryVersion': '6.0',
                      'CFBundleName': 'CelBridgeRustSmoke',
                      'CFBundlePackageType': 'APPL',
                      'CFBundleShortVersionString': '0.2.0',
                      'CFBundleVersion': '1',
                      'MinimumOSVersion': '13.0',
                  },
                  output,
              )
          PY
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator clang \
            -target arm64-apple-ios-simulator \
            -isysroot "$sdk" \
            build/cel-bridge-rust-release-smoke.app/main.c \
            "$rust_library" "$go_library" \
            -framework Foundation \
            -o build/cel-bridge-rust-release-smoke.app/CelBridgeRustSmoke

      - name: Prepare downloaded iOS example
        if: matrix.kind == 'ios'
        run: |
          cp -R examples/flutter-app build/release-ios-example
          python3 -m http.server 8125 --directory build/release-download >build/release-ios-http.log 2>&1 &
          server_pid=$!
          echo "RELEASE_HTTP_PID=$server_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8125/ >/dev/null; then break; fi
            sleep 1
          done
          export CEL_BRIDGE_IOS_XCFRAMEWORK_URL="http://127.0.0.1:8125/cel-bridge-ios-xcframework-v$(cat VERSION).zip"
          export CEL_BRIDGE_IOS_XCFRAMEWORK_CHECKSUM_URL="http://127.0.0.1:8125/checksums.txt"
          cd build/release-ios-example
          flutter pub get
          flutter build ios --simulator --no-codesign --no-pub

      - name: Run downloaded iOS example
        if: matrix.kind == 'ios'
        env:
          CEL_BRIDGE_IOS_XCFRAMEWORK_URL: http://127.0.0.1:8125/cel-bridge-ios-xcframework-v${{ needs.version.outputs.version }}.zip
          CEL_BRIDGE_IOS_XCFRAMEWORK_CHECKSUM_URL: http://127.0.0.1:8125/checksums.txt
        run: |
          cd build/release-ios-example
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /(Shutdown|Booted)/ {print $2; exit}')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          flutter test --no-pub integration_test/runtime_test.dart -d "$device_id"
          xcrun simctl install "$device_id" \
            "$GITHUB_WORKSPACE/build/cel-bridge-rust-release-smoke.app"
          xcrun simctl launch --console "$device_id" \
            com.celbridge.rust-release-smoke | tee "$GITHUB_WORKSPACE/build/ios-rust-release-smoke.log"
          grep -Fq 'cel-bridge rust iOS release smoke: 0' \
            "$GITHUB_WORKSPACE/build/ios-rust-release-smoke.log"

  publish-check:
    needs: [version, release-consumption, release-platform-consumption]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Check package dry-runs
        run: |
          cd sdk/dart
          dart pub get
          dart pub publish --dry-run
          cd ../../
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            CEL_BRIDGE_RUNTIME_SOURCE="$GITHUB_WORKSPACE" \
            cargo package --manifest-path sdk/rust/Cargo.toml --allow-dirty
          CEL_BRIDGE_BUILD_FROM_SOURCE=1 \
            CEL_BRIDGE_RUNTIME_SOURCE="$GITHUB_WORKSPACE" \
            cargo publish --manifest-path sdk/rust/Cargo.toml \
              --dry-run --allow-dirty

  publish:
    needs: [version, publish-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true

      - name: Publish verified GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
