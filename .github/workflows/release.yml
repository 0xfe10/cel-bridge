name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Verify tag and package versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -z "$(git status --short)"
          dart run tool/verify_versions.dart --tag "$RELEASE_TAG"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          successful_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$RELEASE_COMMIT" \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$successful_runs" -ge 1
          successful_platform_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow platform-ci.yml \
            --commit "$RELEASE_COMMIT" \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$successful_platform_runs" -ge 1

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            kind: native
            target: linux-x86_64
          - name: android-arm64-v8a
            runner: ubuntu-latest
            kind: android
            target: android-arm64-v8a
          - name: android-armeabi-v7a
            runner: ubuntu-latest
            kind: android
            target: android-armeabi-v7a
          - name: android-x86_64
            runner: ubuntu-latest
            kind: android
            target: android-x86_64
          - name: macos-arm64
            runner: macos-14
            kind: native
            target: macos-arm64
          - name: ios-arm64
            runner: macos-14
            kind: ios
            target: ios-arm64
          - name: windows-x86_64
            runner: windows-latest
            kind: native
            target: windows-x86_64
          - name: wasm
            runner: ubuntu-latest
            kind: wasm
            target: wasm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Select Android NDK compiler
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Get Dart dependencies
        run: dart pub get

      - name: Build release artifact
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == "wasm" ]]; then
            dart run tool/build_artifact.dart --target wasm --output build/artifacts
            cp build/artifacts/wasm/cel_bridge.wasm build/artifacts/
            cp build/artifacts/wasm/wasm_exec.js build/artifacts/
          elif [[ "${{ matrix.kind }}" == "android" ]]; then
            case "${{ matrix.target }}" in
              android-arm64-v8a) compiler=aarch64-linux-android21-clang ;;
              android-armeabi-v7a) compiler=armv7a-linux-androideabi21-clang ;;
              android-x86_64) compiler=x86_64-linux-android21-clang ;;
              *) echo "unsupported Android target" >&2; exit 1 ;;
            esac
            CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$compiler" \
              dart run tool/build_artifact.dart \
              --target "${{ matrix.target }}" --output build/artifacts
          elif [[ "${{ matrix.kind }}" == "ios" ]]; then
            CC="$(xcrun --sdk iphoneos --find clang)" \
              dart run tool/build_artifact.dart \
              --target "${{ matrix.target }}" --output build/artifacts
            CC="$(xcrun --sdk iphonesimulator --find clang)" \
              dart run tool/build_artifact.dart \
              --target ios-arm64-simulator --output build/artifacts
            CC="$(xcrun --sdk iphonesimulator --find clang)" \
              dart run tool/build_artifact.dart \
              --target ios-x86_64-simulator --output build/artifacts
            mkdir -p build/artifacts/ios-simulator
            lipo -create \
              build/artifacts/ios-arm64-simulator/libcel_bridge.a \
              build/artifacts/ios-x86_64-simulator/libcel_bridge.a \
              -output build/artifacts/ios-simulator/libcel_bridge.a
            xcodebuild -create-xcframework \
              -library build/artifacts/ios-arm64/libcel_bridge.a \
              -headers include \
              -library build/artifacts/ios-simulator/libcel_bridge.a \
              -headers include \
              -output build/artifacts/libcel_bridge.xcframework
            ditto -c -k --sequesterRsrc --keepParent \
              build/artifacts/libcel_bridge.xcframework \
              build/artifacts/cel-bridge-ios-xcframework-v$(cat VERSION).zip
          elif [[ "${{ matrix.target }}" == "macos-arm64" ]]; then
            dart run tool/build_artifact.dart \
              --target macos-arm64 --output build/artifacts
            dart run tool/build_artifact.dart \
              --target macos-x86_64 --output build/artifacts
            mkdir -p build/artifacts/macos-universal
            lipo -create \
              build/artifacts/macos-arm64/libcel_bridge.dylib \
              build/artifacts/macos-x86_64/libcel_bridge.dylib \
              -output build/artifacts/macos-universal/libcel_bridge.dylib
            tar -czf \
              build/artifacts/cel-bridge-macos-universal-v$(cat VERSION).tar.gz \
              -C build/artifacts/macos-universal libcel_bridge.dylib
          else
            dart run tool/build_artifact.dart \
              --target "${{ matrix.target }}" --output build/artifacts
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.name }}
          path: build/artifacts/*
          if-no-files-found: error

  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: build/artifacts
          merge-multiple: true

      - name: Verify default Web integrity
        run: |
          dart run tool/verify_web_integrity.dart \
            --wasm build/artifacts/cel_bridge.wasm \
            --wasm-exec build/artifacts/wasm_exec.js

      - name: Generate and verify manifest
        run: |
          set -euo pipefail
          mkdir -p build/release
          manifest="build/release/cel-bridge-manifest-v$(cat VERSION).json"
          dart run tool/build_manifest.dart \
            --input build/artifacts --output "$manifest"
          dart run tool/verify_artifact.dart \
            --manifest "$manifest" --input build/artifacts
          find build/artifacts -maxdepth 1 -type f -exec cp {} build/release/ \;
          version="$(cat VERSION)"
          git archive --format=tar.gz \
            --prefix="cel-bridge-$version/" "$GITHUB_SHA" \
            -o "build/release/cel-bridge-source-v$version.tar.gz"
          : > build/release/checksums.txt
          for file in build/release/*; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            [[ "$name" != "checksums.txt" ]] || continue
            [[ "$name" != cel-bridge-manifest-*.json ]] || continue
            (cd build/release && sha256sum "$name") \
              >> build/release/checksums.txt
          done
          sort -k2 build/release/checksums.txt -o build/release/checksums.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: ${{ github.ref_name }}
          name: cel-bridge ${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/release/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-consumption:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Download assets from Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/release-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir build/release-download

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/verify_artifact.dart \
            --manifest build/release-download/cel-bridge-manifest-v$(cat VERSION).json \
            --input build/release-download
          (cd build/release-download && sha256sum -c checksums.txt)
          while IFS= read -r -d '' archive; do
            name="$(basename "$archive")"
            case "$archive" in
              *.tar.gz) listing="$(tar -tzf "$archive")" ;;
              *.zip) listing="$(unzip -Z1 "$archive")" ;;
              *) echo "unsupported archive $archive" >&2; exit 1 ;;
            esac
            case "$name" in
              cel-bridge-source-*)
                grep -Eq '(^|/)go\.mod$' <<<"$listing"
                ;;
              cel-bridge-wasm-*)
                grep -Eq '(^|/)cel_bridge\.wasm$' <<<"$listing"
                grep -Eq '(^|/)wasm_exec\.js$' <<<"$listing"
                ;;
              *ios-xcframework*)
                grep -Eq '(^|/)libcel_bridge\.a$' <<<"$listing"
                ;;
              *ios-*)
                grep -Eq '(^|/)libcel_bridge\.a$' <<<"$listing"
                ;;
              *windows-*)
                grep -Eq '(^|/)cel_bridge\.dll$' <<<"$listing"
                ;;
              *macos-*)
                grep -Eq '(^|/)libcel_bridge\.dylib$' <<<"$listing"
                ;;
              *)
                grep -Eq '(^|/)libcel_bridge\.so$' <<<"$listing"
                ;;
            esac
          done < <(find build/release-download -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) -print0)

      - name: Run downloaded Web release smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-web-host/normal build/release-web-host/retry
          dart compile js tool/web_smoke.dart \
            -o build/release-web-host/normal/main.dart.js
          dart compile js tool/web_retry_smoke.dart \
            -o build/release-web-host/retry/main.dart.js
          cp tool/web_smoke.html build/release-web-host/normal/index.html
          cp tool/web_retry_smoke.html build/release-web-host/retry/index.html
          cp build/release-download/cel_bridge.wasm build/release-web-host/
          cp build/release-download/wasm_exec.js build/release-web-host/
          python3 -m http.server 8127 --directory build/release-web-host \
            >build/release-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8127/normal/ \
              >/dev/null; then break; fi
            sleep 1
          done
          dart run tool/web_smoke_runner.dart \
            http://127.0.0.1:8127/normal/ \
            | tee build/release-web-host/normal/result.txt
          grep -Fq '0.1.0|true|true' build/release-web-host/normal/result.txt
          dart run tool/web_smoke_runner.dart \
            http://127.0.0.1:8127/retry/ \
            | tee build/release-web-host/retry/result.txt
          grep -Fq 'retry|0.1.0|true' build/release-web-host/retry/result.txt

      - name: Run release hook against downloaded Draft assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8125 --directory build/release-download \
            >build/release-download/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8125/ >/dev/null; then
              break
            fi
            sleep 1
          done
          cd tool/release_http_consumer
          dart pub get
          dart run bin/main.dart

  release-platform-consumption:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            kind: native
          - name: macos
            runner: macos-14
            kind: native
          - name: ios
            runner: macos-14
            kind: ios
          - name: android
            runner: ubuntu-latest
            kind: android
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Download platform assets from Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/release-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir build/release-download

      - name: Run downloaded platform smoke
        shell: bash
        env:
          PLATFORM_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          python3 -m http.server 8125 --directory build/release-download \
            >build/release-download/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8125/ >/dev/null; then
              break
            fi
            sleep 1
          done

          case "$PLATFORM_KIND" in
            native)
              cd tool/release_http_consumer
              dart pub get
              dart run bin/main.dart
              ;;
            ios)
              export CEL_BRIDGE_IOS_XCFRAMEWORK_URL="http://127.0.0.1:8125/cel-bridge-ios-xcframework-v$(cat VERSION).zip"
              export CEL_BRIDGE_IOS_XCFRAMEWORK_CHECKSUM_URL="http://127.0.0.1:8125/checksums.txt"
              cd example/flutter_app
              flutter pub get
              flutter build ios --simulator --no-codesign
              ;;
            android)
              cp -R example/flutter_app build/release-android-example
              python3 -c "from pathlib import Path; p=Path('build/release-android-example/pubspec.yaml'); s=p.read_text(); old='      build_from_source: true'; new='      release_base_url: http://127.0.0.1:8125/\\n      allow_insecure_release_base: true'; assert old in s, 'example hook configuration changed'; p.write_text(s.replace(old, new))"
              cd build/release-android-example
              flutter pub get
              flutter build apk --debug
              ;;
            *)
              echo "unsupported platform kind: $PLATFORM_KIND" >&2
              exit 1
              ;;
          esac

  publish-check:
    needs: [release-consumption, release-platform-consumption]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Validate pub package
        run: dart pub publish --dry-run

  publish:
    needs: [release-consumption, release-platform-consumption, publish-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false
