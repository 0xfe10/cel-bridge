name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Verify tag and package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -z "$(git status --short)"
          dart run tool/verify_versions.dart --tag "$RELEASE_TAG"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          successful_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$RELEASE_COMMIT" \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$successful_runs" -ge 1

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            kind: native
            target: linux-x86_64
          - name: android-arm64-v8a
            runner: ubuntu-latest
            kind: android
            target: android-arm64-v8a
          - name: macos-arm64
            runner: macos-14
            kind: native
            target: macos-arm64
          - name: ios-arm64
            runner: macos-14
            kind: ios
            target: ios-arm64
          - name: windows-x86_64
            runner: windows-latest
            kind: native
            target: windows-x86_64
          - name: wasm
            runner: ubuntu-latest
            kind: wasm
            target: wasm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Select Android NDK compiler
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk"
          compiler="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          test -x "$compiler"
          echo "CC=$compiler" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Get Dart dependencies
        run: dart pub get

      - name: Build release artifact
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == "wasm" ]]; then
            dart run tool/build_artifact.dart --target wasm --output build/artifacts
            cp build/artifacts/wasm/cel_bridge.wasm build/artifacts/
            cp build/artifacts/wasm/wasm_exec.js build/artifacts/
          elif [[ "${{ matrix.kind }}" == "ios" ]]; then
            CC="$(xcrun --sdk iphoneos --find clang)" \
              dart run tool/build_artifact.dart \
              --target "${{ matrix.target }}" --output build/artifacts
          else
            dart run tool/build_artifact.dart \
              --target "${{ matrix.target }}" --output build/artifacts
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.name }}
          path: build/artifacts/*
          if-no-files-found: error

  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: build/artifacts
          merge-multiple: true

      - name: Generate and verify manifest
        run: |
          set -euo pipefail
          mkdir -p build/release
          manifest="build/release/cel-bridge-manifest-v$(cat VERSION).json"
          dart run tool/build_manifest.dart \
            --input build/artifacts --output "$manifest"
          dart run tool/verify_artifact.dart \
            --manifest "$manifest" --input build/artifacts
          cp build/artifacts/* build/release/

      - name: Create Draft Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: ${{ github.ref_name }}
          name: cel-bridge ${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/release/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-consumption:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Download assets from Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/release-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir build/release-download

      - name: Verify downloaded release assets
        run: |
          dart run tool/verify_artifact.dart \
            --manifest build/release-download/cel-bridge-manifest-v$(cat VERSION).json \
            --input build/release-download

      - name: Run remote release consumer smoke
        working-directory: tool/release_consumer
        run: |
          dart pub get
          dart run

  publish-check:
    needs: release-consumption
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: dart pub get

      - name: Validate pub package
        run: dart pub publish --dry-run

  publish:
    needs: [release-consumption, publish-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false
