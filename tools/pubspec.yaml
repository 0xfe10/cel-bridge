name: cel_bridge_tools
description: Private build and verification tools for cel-bridge.
publish_to: none
version: 0.5.1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  archive: ^4.0.9
  cel_bridge:
    path: ../sdk/dart
  crypto: ^3.0.7
  web: ^1.1.1

hooks:
  user_defines:
    cel_bridge:
      build_from_source: true

dev_dependencies:
  json_schema: ^5.2.2
  lints: ^6.0.0
  test: ^1.26.0
