name: cel_bridge_release_http_consumer
description: Local HTTP release-download smoke package.
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  cel_bridge:
    path: ../../../sdk/dart

hooks:
  user_defines:
    cel_bridge:
      release_base_url: http://127.0.0.1:8125/
      allow_insecure_release_base: true
