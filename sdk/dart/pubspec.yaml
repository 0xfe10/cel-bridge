name: cel_bridge
description: A cross-platform CEL runtime for Dart and Flutter.
version: 0.4.0
publish_to: none
repository: https://github.com/0xfe10/cel-bridge

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  archive: ^4.0.9
  code_assets: ^1.2.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.0.2
  web: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

hooks:
  user_defines:
    cel_bridge:
      build_from_source: true

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CelBridgePlugin
