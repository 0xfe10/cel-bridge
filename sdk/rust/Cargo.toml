[package]
name = "cel-bridge"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Rust bindings for the cel-bridge Go CEL runtime."
readme = "README.md"
repository = "https://github.com/0xfe10/cel-bridge"
links = "cel_bridge"
build = "build.rs"
exclude = ["tests/conformance.rs", "tests/errors.rs"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
flate2 = "1.1"
sha2 = "0.10"
serde_json = "1.0"
tar = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
